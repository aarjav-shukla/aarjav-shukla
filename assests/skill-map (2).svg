<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 800 540" width="800" height="540">
<defs>
<style>
.center-ring{transform-origin:400px 260px}
@keyframes ring-flow-cw{from{stroke-dashoffset:0}to{stroke-dashoffset:-346}}
@keyframes ring-flow-ccw{from{stroke-dashoffset:0}to{stroke-dashoffset:346}}
@keyframes node-breathe{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spoke-pulse{0%,100%{stroke-dashoffset:0;opacity:0.25}50%{stroke-dashoffset:-24;opacity:0.5}}
@keyframes phosphor-pulse{0%,100%{opacity:0.8}50%{opacity:1}}
</style>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.4" fill="#1B2430" opacity="0.55"/>
</pattern>
</defs>

<rect width="800" height="520" fill="#0B0F14"/>
